# RateWatch production stack: ECR repos, snapshot bucket, secrets, IAM roles,
# CloudWatch log groups (14-day retention), the Express web service and the
# daily pipeline schedule.
#
# Deploy (Kiro, one-time bootstrap; later deploys go through .github/workflows/deploy.yml):
#   aws cloudformation deploy --template-file infra/aws/ratewatch.yaml --stack-name ratewatch \
#     --capabilities CAPABILITY_NAMED_IAM \
#     --parameter-overrides EmailAddress=you@example.com VpcSubnetIds=subnet-aaa,subnet-bbb
#
# Doc citations for every non-obvious property are inline. Primary sources:
#   [1] https://docs.aws.amazon.com/AmazonECS/latest/developerguide/express-service-getting-started.html
#   [2] https://docs.aws.amazon.com/cli/latest/reference/ecs/create-express-gateway-service.html
#   [3] https://docs.aws.amazon.com/AWSCloudFormation/latest/TemplateReference/aws-resource-ecs-expressgatewayservice.html
#   [4] https://docs.aws.amazon.com/AWSCloudFormation/latest/TemplateReference/aws-properties-scheduler-schedule-ecsparameters.html
AWSTemplateFormatVersion: "2010-09-09"
Description: RateWatch - snapshot bucket, log groups, IAM roles, Express web service, daily pipeline schedule.

Parameters:
  EmailAddress:
    Type: String
    Description: Budget alarm subscriber (account owner email).
    AllowedPattern: "^[^@]+@[^@]+\\.[^@]+$"
  VpcSubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: Default-VPC public subnets for the web service and the scheduled pipeline task.
  WebImageTag:
    Type: String
    Default: latest
    Description: Image tag the Express service deploys (sha tag pushed by deploy.yml).
  PipelineImageTag:
    Type: String
    Default: latest

Resources:
  Cluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: ratewatch

  SnapshotBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    Properties:
      BucketName: !Sub "ratewatch-${AWS::AccountId}-${AWS::Region}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256  # SSE-S3; snapshots are public data, no CMK needed

  AppSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub "ratewatch/app-${AWS::StackName}"
      Description: JSON keys OPENAI_API_KEY, LANGFUSE_GATEWAY_HOST, LANGFUSE_GATEWAY_KEY, LANGFUSE_PUBLIC_KEY, LANGFUSE_SECRET_KEY, LANGFUSE_BASE_URL, GROQ_API_KEY, FIINQUANT_USERNAME, FIINQUANT_PASSWORD. Values are filled by Kiro after stack creation.

  LogGroupWeb:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /ecs/ratewatch-web
      RetentionInDays: 14

  LogGroupPipeline:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /ecs/ratewatch-pipeline
      RetentionInDays: 14

  # Execution role: pulls images, writes the two log groups, reads the app secret. [1]
  ExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: ratewatch-execution
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: ecs-tasks.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: execution
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: "*"  # GetAuthorizationToken is not resource-scopable
              - Effect: Allow
                Action:
                  - ecr:BatchCheckLayerAvailability
                  - ecr:GetDownloadUrlForLayer
                  - ecr:BatchGetImage
                Resource:
                  - !Sub "${EcrRepoWeb.Arn}"
                  - !Sub "${EcrRepoPipeline.Arn}"
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource:
                  - !Sub "${LogGroupWeb.Arn}:*"
                  - !Sub "${LogGroupPipeline.Arn}:*"
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Sub "${AppSecret.Arn}"

  # Web task role: read-only on the snapshot prefix. [1] taskRoleArn
  WebTaskRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: ratewatch-web-task
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: ecs-tasks.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: snapshot-read
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: s3:GetObject
                Resource: !Sub "${SnapshotBucket.Arn}/snapshots/*"

  # Pipeline task role: write-only on the snapshot and bronze prefixes.
  PipelineTaskRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: ratewatch-pipeline-task
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: ecs-tasks.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: snapshot-write
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: s3:PutObject
                Resource:
                  - !Sub "${SnapshotBucket.Arn}/snapshots/*"
                  - !Sub "${SnapshotBucket.Arn}/bronze/*"

  # Scheduler invocation role: RunTask + PassRole on the two task roles. [4]
  SchedulerRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: ratewatch-scheduler
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: scheduler.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: run-pipeline
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: ecs:RunTask
                Resource: !Ref PipelineTaskDefinition
              - Effect: Allow
                Action: iam:PassRole
                Resource:
                  - !Sub "${ExecutionRole.Arn}"
                  - !Sub "${PipelineTaskRole.Arn}"

  # Express Mode web service: 0.5 vCPU / 1 GB, container port 3000, ALB health
  # check on /api/health. [1] [2] [3]
  WebService:
    Type: AWS::ECS::ExpressGatewayService
    Properties:
      Cluster: !Ref Cluster
      ServiceName: ratewatch-web
      Cpu: "0.5"
      Memory: "1"
      InfrastructureRoleArn: !Sub "${InfrastructureRole.Arn}"
      ExecutionRoleArn: !Sub "${ExecutionRole.Arn}"
      TaskRoleArn: !Sub "${WebTaskRole.Arn}"
      HealthCheckPath: /api/health
      PrimaryContainer:
        Image: !Sub "${EcrRepoWeb.RepositoryUri}:${WebImageTag}"
        ContainerPort: 3000
        Secrets:
          - { Name: OPENAI_API_KEY, ValueFrom: !Sub "${AppSecret.Arn}:OPENAI_API_KEY::" }
          - { Name: LANGFUSE_GATEWAY_HOST, ValueFrom: !Sub "${AppSecret.Arn}:LANGFUSE_GATEWAY_HOST::" }
          - { Name: LANGFUSE_GATEWAY_KEY, ValueFrom: !Sub "${AppSecret.Arn}:LANGFUSE_GATEWAY_KEY::" }
          - { Name: LANGFUSE_PUBLIC_KEY, ValueFrom: !Sub "${AppSecret.Arn}:LANGFUSE_PUBLIC_KEY::" }
          - { Name: LANGFUSE_SECRET_KEY, ValueFrom: !Sub "${AppSecret.Arn}:LANGFUSE_SECRET_KEY::" }
          - { Name: LANGFUSE_BASE_URL, ValueFrom: !Sub "${AppSecret.Arn}:LANGFUSE_BASE_URL::" }
          - { Name: GROQ_API_KEY, ValueFrom: !Sub "${AppSecret.Arn}:GROQ_API_KEY::" }

  InfrastructureRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: ratewatch-express-infrastructure
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: ecs.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSInfrastructureRoleforExpressGatewayServices

  PipelineTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: ratewatch-pipeline
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      Cpu: "512"
      Memory: "1024"
      ExecutionRoleArn: !Sub "${ExecutionRole.Arn}"
      TaskRoleArn: !Sub "${PipelineTaskRole.Arn}"
      ContainerDefinitions:
        - Name: pipeline
          Image: !Sub "${EcrRepoPipeline.RepositoryUri}:${PipelineImageTag}"
          Essential: true
          Command: ["--stage", "all"]
          Environment:
            - { Name: RATEWATCH_S3_URI, Value: !Sub "s3://${SnapshotBucket}/snapshots/ratewatch/snapshot.json" }
          Secrets:
            - { Name: FIINQUANT_USERNAME, ValueFrom: !Sub "${AppSecret.Arn}:FIINQUANT_USERNAME::" }
            - { Name: FIINQUANT_PASSWORD, ValueFrom: !Sub "${AppSecret.Arn}:FIINQUANT_PASSWORD::" }
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Sub "${LogGroupPipeline}"
              awslogs-region: !Sub "${AWS::Region}"
              awslogs-stream-prefix: pipeline

  # Daily 01:00 Asia/Saigon (18:00 UTC) pipeline run. [4]
  PipelineSchedule:
    Type: AWS::Scheduler::Schedule
    Properties:
      ScheduleExpression: cron(0 18 * * ? *)
      FlexibleTimeWindow:
        Mode: OFF
      Target:
        Arn: !GetAtt Cluster.Arn
        RoleArn: !Sub "${SchedulerRole.Arn}"
        EcsParameters:
          LaunchType: FARGATE
          TaskCount: 1
          TaskDefinitionArn: !Ref PipelineTaskDefinition
          NetworkConfiguration:
            AwsvpcConfiguration:
              Subnets: !Ref VpcSubnetIds
              AssignPublicIp: ENABLED

Outputs:
  SnapshotBucketName:
    Value: !Ref SnapshotBucket
  AppSecretArn:
    Value: !Sub "${AppSecret.Arn}"
  WebRepoUri:
    Value: !Sub "${EcrRepoWeb.RepositoryUri}"
  PipelineRepoUri:
    Value: !Sub "${EcrRepoPipeline.RepositoryUri}"
  ClusterName:
    Value: !Ref Cluster
