# GitHub Actions OIDC provider and deploy role. One-time bootstrap (Kiro, root credentials):
#   aws cloudformation deploy --stack-name ratewatch-github-oidc \
#     --template-file infra/aws/github-oidc.yaml \
#     --parameter-overrides GitHubRepo=OWNER/REPO \
#     --capabilities CAPABILITY_NAMED_IAM
# The workflow then assumes the role via vars.AWS_DEPLOY_ROLE_ARN.
AWSTemplateFormatVersion: "2010-09-09"
Description: GitHub Actions OIDC provider and deploy role for VietLeap.

Parameters:
  GitHubRepo:
    Type: String
    Description: GitHub repository in OWNER/REPO form that may assume the deploy role.

  ImmutableSubPrefix:
    Type: String
    Description: GitHub immutable OIDC subject prefix (gh api repos/OWNER/REPO/actions/oidc/customization/sub).

Resources:
  DeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: vietleap-github-deploy
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Sub "arn:aws:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com"
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
              StringLike:
                token.actions.githubusercontent.com:sub:
                  - !Sub "repo:${GitHubRepo}:*"
                  - !Sub "${ImmutableSubPrefix}:*"
      Policies:
        - PolicyName: deploy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # Push images to the two ECR repos.
              - Effect: Allow
                Action:
                  - ecr:GetAuthorizationToken
                  - ecr:BatchCheckLayerAvailability
                  - ecr:GetDownloadUrlForLayer
                  - ecr:InitiateLayerUpload
                  - ecr:UploadLayerPart
                  - ecr:CompleteLayerUpload
                  - ecr:PutImage
                  - ecr:BatchGetImage
                Resource: "*"
              # Roll the Express service to the new image tag.
              - Effect: Allow
                Action:
                  - ecs:UpdateExpressGatewayService
                  - ecs:DescribeExpressGatewayService
                Resource: "*"
              - Effect: Allow
                Action: iam:PassRole
                Resource:
                  - !Sub "arn:aws:iam::${AWS::AccountId}:role/vietleap-execution"
                  - !Sub "arn:aws:iam::${AWS::AccountId}:role/vietleap-web-task"
                  - !Sub "arn:aws:iam::${AWS::AccountId}:role/vietleap-pipeline-task"
                  - !Sub "arn:aws:iam::${AWS::AccountId}:role/vietleap-express-infrastructure"
              # Read stack outputs (service ARN, secret ARN) for the update call.
              - Effect: Allow
                Action: cloudformation:DescribeStacks
                Resource: "*"
              - Effect: Allow
                Action: sts:GetCallerIdentity
                Resource: "*"

Outputs:
  DeployRoleArn:
    Value: !GetAtt DeployRole.Arn
