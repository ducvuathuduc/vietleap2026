# OpenAPI 3.1 fragment — feature 007 (merged into specs/001-vietleap-insight-kit/contracts/openapi.json after T704)
components:
  schemas:
    WhatIfChange:
      type: object
      required: [feature, pct_change]
      properties:
        feature: {type: string, maxLength: 200}
        pct_change: {type: number, minimum: -30, maximum: 30}
      additionalProperties: false
    WhatIfScenarioRequest:
      type: object
      required: [changes]
      properties:
        changes: {type: array, minItems: 1, maxItems: 5, items: {$ref: "#/components/schemas/WhatIfChange"}}   # features unique (422 otherwise)
        target: {type: [string, "null"]}
      additionalProperties: false
    WhatIfScenarioResult:
      type: object
      required: [changes, target, target_change_pct, ci90_pct, baseline_target_mean, interpretation]
      properties:
        changes: {type: array, items: {$ref: "#/components/schemas/WhatIfChange"}}
        target: {type: string}
        target_change_pct: {type: [number, "null"]}
        ci90_pct: {type: array, items: {type: [number, "null"]}, minItems: 2, maxItems: 2}
        target_change_abs: {type: [number, "null"]}
        baseline_target_mean: {type: [number, "null"]}
        range_warnings: {type: array, items: {type: string}}
        interpretation: {type: string}
    SavedScenario:
      type: object
      required: [name, request, result]
      properties:
        name: {type: string, minLength: 1, maxLength: 60}
        request: {$ref: "#/components/schemas/WhatIfScenarioRequest"}
        result: {$ref: "#/components/schemas/WhatIfScenarioResult"}
paths:
  /api/datasets/{ds_id}/whatif/scenario:
    post:
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/WhatIfScenarioRequest"}}}}
      responses:
        "200": {description: joint change, content: {application/json: {schema: {$ref: "#/components/schemas/WhatIfScenarioResult"}}}}
        "404": {description: dataset or drivers model not found}
        "422": {description: validation error}
        "429": {description: rate limited}
  /api/datasets/{ds_id}/whatif/scenarios:
    get:
      responses: {"200": {description: saved scenarios (≤ 4), content: {application/json: {schema: {type: array, maxItems: 4, items: {$ref: "#/components/schemas/SavedScenario"}}}}}}
    post:
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [name, request], properties: {name: {type: string, maxLength: 60}, request: {$ref: "#/components/schemas/WhatIfScenarioRequest"}}}}}}
      responses: {"200": {description: saved (server computes result)}, "409": {description: already 4 scenarios}}
