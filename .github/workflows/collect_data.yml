name: Collect data

on:
  schedule:
    - cron: "15 0 * * *" # 07:15 Asia/Saigon
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Collect WDI and record source mode
        shell: bash
        run: |
          mkdir -p data/cache/snapshots
          if python de.py snapshot wdi_asean; then
            echo 'WDI live API' > data/cache/snapshots/source_mode.txt
          else
            echo '::warning::WDI live collection failed. Preparing the practice CSV as fallback.'
            python de.py snapshot scenarios/wdi_asean/sources.offline.yaml
            echo 'WDI practice CSV fallback' > data/cache/snapshots/source_mode.txt
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: vietleap-wdi-offline-cache
          path: data/cache/snapshots/
          if-no-files-found: error
          retention-days: 7
