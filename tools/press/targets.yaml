# W2-PRESS recipes: one entry per source. Fields map extractor output -> press_long contract.
version: 1
targets:
  - source_id: tcbs_banking_q3_2026
    publisher: TCBS Research
    title_vi: "Cập nhật KQKD ngành ngân hàng Q3/2026 (TCBS)"
    url: https://www.tcbs.com.vn/wp-content/uploads/2026/11/20261116_Banking_Sector_Earnings_Update_Q3_2026.pdf
    method: pdf
    extractor: tcbs_banking
    license_note: "TCBS Research, báo cáo công khai; dùng cho nghiên cứu cá nhân, ghi nguồn tcbs.com.vn"

  - source_id: theinvestor_credit_oct_2026
    publisher: The Investor
    title_vi: "Tăng trưởng tín dụng chậm lại nửa đầu tháng 10/2026"
    url: https://theinvestor.vn/credit-growth-slows-slips-in-first-half-of-october-d20264.html
    method: tinyfish
    period: 2026-Q3
    decimal: vn
    published_date_field: published_date
    max_usd: 0.5
    cache_ttl_h: 8760
    license_note: "Báo điện tử The Investor; trích dẫn số liệu, ghi nguồn"
    goal: |
      Open this article and extract Vietnam's banking-system credit growth as printed.
      Return: credit_ytd_sep = credit growth year-to-date as of 30/9/2026 in percent;
      credit_yoy_sep = credit growth year-on-year as of 30/9/2026 in percent;
      credit_ytd_oct14 = credit growth year-to-date as of 14/10/2026 in percent;
      published_date = article date in dd/mm/yyyy. Do not estimate or convert units.
    output_schema:
      type: object
      properties:
        credit_ytd_sep: {type: number}
        credit_yoy_sep: {type: number}
        credit_ytd_oct14: {type: number}
        published_date: {type: string}
      required: [credit_ytd_sep, credit_yoy_sep, credit_ytd_oct14, published_date]
    fields:
      - {field: credit_ytd_sep, indicator_id: credit_growth, measure_type: ytd, unit: "%", geo: VNM, period: 2026-Q3}
      - {field: credit_yoy_sep, indicator_id: credit_growth, measure_type: yoy, unit: "%", geo: VNM, period: 2026-Q3}
      - {field: credit_ytd_oct14, indicator_id: credit_growth, measure_type: ytd, unit: "%", geo: VNM, period: 2026-10}

  - source_id: vneconomy_margin_q3_2026
    publisher: VnEconomy
    title_vi: "Dư nợ margin giảm tốc trong quý 3, đạt kỷ lục 457,5 nghìn tỷ đồng"
    url: https://vneconomy.vn/du-no-margin-giam-toc-trong-quy-3-dat-ky-luc-4575-nghin-ty-dong.htm
    method: tinyfish
    period: 2026-Q3
    decimal: vn
    published_date_field: published_date
    max_usd: 0.5
    cache_ttl_h: 8760
    license_note: "VnEconomy (FiinTrade); trích dẫn số liệu, ghi nguồn"
    goal: |
      Open this article about margin debt at Vietnamese securities companies in Q3/2026.
      Return: margin_debt = margin debt at end-Q3/2026 in thousand billion VND (nghìn tỷ đồng);
      margin_growth_ytd = growth vs end-2025 in percent; margin_share = margin debt as percent of free-float capital;
      trading_value = average daily trading value in Q3/2026 in thousand billion VND;
      trading_value_qoq = its quarter-on-quarter change in percent; published_date = article date dd/mm/yyyy.
      Use numbers exactly as printed; do not convert units.
    output_schema:
      type: object
      properties:
        margin_debt: {type: number}
        margin_growth_ytd: {type: number}
        margin_share: {type: number}
        trading_value: {type: number}
        trading_value_qoq: {type: number}
        published_date: {type: string}
      required: [margin_debt, margin_growth_ytd, margin_share, trading_value, trading_value_qoq, published_date]
    fields:
      - {field: margin_debt, indicator_id: margin_debt, measure_type: level, unit: nghin_ty_vnd, geo: VNM}
      - {field: margin_growth_ytd, indicator_id: margin_debt, measure_type: ytd, unit: "%", geo: VNM}
      - {field: margin_share, indicator_id: margin_share_free_float, measure_type: share, unit: "%", geo: VNM}
      - {field: trading_value, indicator_id: market_turnover, measure_type: level, unit: nghin_ty_vnd, geo: VNM}
      - {field: trading_value_qoq, indicator_id: market_turnover, measure_type: ratio, unit: "%", geo: VNM}
    text_fields:
      - {pattern: 'tương đương ([\d.,]+)% so với cuối quý 2/2026', indicator_id: margin_debt, measure_type: ratio, unit: "%"}

  - source_id: vneconomy_oct_crosscheck
    publisher: VnEconomy
    title_vi: "Khối ngoại bán ròng gần 1 tỷ USD trong tháng 10 (đối chiếu)"
    url: https://vneconomy.vn/khoi-ngoai-ban-rong-gan-1-ty-usd-trong-thang-10.htm
    method: tinyfish
    period: 2026-10
    decimal: vn
    published_date_field: published_date
    max_usd: 0.4
    cache_ttl_h: 8760
    license_note: "VnEconomy; dòng đối chiếu, nguồn chính là FiinQuant"
    goal: |
      Open this article and return VN-Index closing level at end-October 2026 (points) and foreign investors'
      net sell value in October 2026 in billion VND (tỷ đồng), plus the article date dd/mm/yyyy.
      Numbers exactly as printed.
    output_schema:
      type: object
      properties:
        vnindex_close: {type: number}
        foreign_net_sell_ty_vnd: {type: number}
        published_date: {type: string}
      required: [vnindex_close, foreign_net_sell_ty_vnd, published_date]
    fields:
      - {field: vnindex_close, indicator_id: vnindex_close, measure_type: level, unit: points, geo: VNM}
      - {field: foreign_net_sell_ty_vnd, indicator_id: foreign_net_sell, measure_type: level, unit: ty_vnd, geo: VNM}

  - source_id: realtique_cbre_hcm_q3_2026
    publisher: Realtique (tổng hợp CBRE)
    title_vi: "Giá căn hộ TP.HCM quý 3/2026"
    url: https://www.realtique.net/vi/tin-tuc-vi/cap-nhat-thi-truong-vi/45638/gia-can-ho-tphcm-quy-3-2026/
    method: tinyfish
    period: 2026-Q3
    decimal: vn
    geo: TP.HCM
    segment_table: cbre_realtique
    published_date_field: published_date
    max_usd: 0.5
    cache_ttl_h: 8760
    license_note: "Realtique tổng hợp CBRE; dùng cho nghiên cứu, ghi nguồn"
    goal: |
      Open this article summarising CBRE's Ho Chi Minh City apartment market Q3/2026 report.
      Return: absorption_units = apartments sold in Q3/2026 (units); absorption_yoy = their year-on-year change in percent;
      new_supply_yoy = new supply year-on-year change in percent; primary_price = primary apartment price in million VND per m2;
      primary_price_yoy = its year-on-year change in percent; mortgage_rate = home-loan interest rate in percent;
      deposit_rate_12m = 12-month deposit rate in percent; published_date = article date dd/mm/yyyy.
      If a value is negative keep the minus sign. Do not estimate.
    output_schema:
      type: object
      properties:
        absorption_units: {type: number}
        absorption_yoy: {type: number}
        new_supply_yoy: {type: number}
        primary_price: {type: number}
        primary_price_yoy: {type: number}
        mortgage_rate: {type: number}
        deposit_rate_12m: {type: number}
        published_date: {type: string}
      required: [absorption_units, absorption_yoy, new_supply_yoy, primary_price, primary_price_yoy,
                 mortgage_rate, deposit_rate_12m, published_date]
    fields:
      - {field: mortgage_rate, indicator_id: mortgage_rate, measure_type: level, unit: "%"}
      - {field: deposit_rate_12m, indicator_id: deposit_rate_12m, measure_type: level, unit: "%"}

  - source_id: savills_vn_reports
    publisher: Savills Việt Nam
    title_vi: "Danh sách báo cáo thị trường mới nhất"
    url: https://www.savills.com.vn/insight-and-opinion/
