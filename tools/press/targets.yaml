  - source_id: nhadautu_fdi_10m_2026
    publisher: Nhà Đầu Tư
    title_vi: "Vốn FDI đăng ký 10 tháng/2026 cao nhất 17 năm"
    url: https://nhadautu.vn/von-fdi-dang-ky-cao-nhat-17-nam-d108659.html
    method: tinyfish
    period: 2026-10
    decimal: vn
    published_date_field: published_date
    max_usd: 0.6
    cache_ttl_h: 8760
    license_note: "Báo Nhà Đầu Tư; trích dẫn số liệu, ghi nguồn"
    goal: |
      Open this article about foreign direct investment in Vietnam in the first 10 months of 2026.
      Return: registered_usd_bn = total registered FDI in billion USD; new_usd_bn = newly registered capital in billion USD;
      realized_usd_bn = realised/disbursed FDI in billion USD; registered_yoy = registered FDI year-on-year growth in percent;
      realized_yoy = realised FDI year-on-year growth in percent; published_date = article date dd/mm/yyyy;
      provinces = the top provinces by registered FDI with name, amount_usd_bn and share_pct;
      partners = the top partner countries with name and amount_usd_bn.
      Use the numbers exactly as printed (e.g. 54.85, not 54,850).
    output_schema:
      type: object
      properties:
        registered_usd_bn: {type: number}
        new_usd_bn: {type: number}
        realized_usd_bn: {type: number}
        registered_yoy: {type: number}
        realized_yoy: {type: number}
        published_date: {type: string}
        provinces:
          type: array
          items:
            type: object
            properties:
              name: {type: string}
              amount_usd_bn: {type: number}
              share_pct: {type: number}
            required: [name, amount_usd_bn, share_pct]
        partners:
          type: array
          items:
            type: object
            properties:
              name: {type: string}
              amount_usd_bn: {type: number}
            required: [name, amount_usd_bn]
      required: [registered_usd_bn, new_usd_bn, realized_usd_bn, registered_yoy, realized_yoy, published_date]
    fields:
      - {field: registered_usd_bn, indicator_id: fdi_registered, measure_type: level, unit: bn_usd, geo: VNM}
      - {field: new_usd_bn, indicator_id: fdi_new, measure_type: level, unit: bn_usd, geo: VNM}
      - {field: realized_usd_bn, indicator_id: fdi_realized, measure_type: level, unit: bn_usd, geo: VNM}
      - {field: registered_yoy, indicator_id: fdi_registered, measure_type: yoy, unit: "%", geo: VNM}
      - {field: realized_yoy, indicator_id: fdi_realized, measure_type: yoy, unit: "%", geo: VNM}
    lists:
      - list_field: provinces
        geo_field: name
        fields:
          - {field: amount_usd_bn, indicator_id: fdi_province, measure_type: level, unit: bn_usd}
          - {field: share_pct, indicator_id: fdi_province, measure_type: share, unit: "%"}
      - list_field: partners
        geo_field: name
        fields:
          - {field: amount_usd_bn, indicator_id: fdi_partner, measure_type: level, unit: bn_usd}

  - source_id: caa_dtc_10m_2026
    publisher: Cổng thông tin đầu tư công
    title_vi: "10 tháng giải ngân vốn đầu tư công cả nước đạt 74,1% kế hoạch"
    url: https://caa.gov.vn/hoat-dong-nganh/10-thang-giai-ngan-von-dau-tu-cong-cua-ca-nuoc-dat-741-ke-hoach-20261105113658123.htm
    method: tinyfish
    period: 2026-10
    decimal: vn
    published_date_field: published_date
    max_usd: 0.6
    cache_ttl_h: 8760
    license_note: "Cổng thông tin đầu tư công; trích dẫn số liệu, ghi nguồn"
    goal: |
      Open this article on public-investment disbursement in the first 10 months of 2026.
      Return: disbursed_ty_vnd = total disbursed amount in billion VND (tỷ đồng); pct_plan = percent of the 2026 plan;
      yoy_pct_point = increase vs the same period last year in percentage points; central_pct_plan = central budget
      disbursement as percent of plan; local_pct_plan = local budget disbursement as percent of plan;
      published_date = article date dd/mm/yyyy; provinces = top provinces by disbursed amount with name and amount_ty_vnd.
      Use numbers exactly as printed; do not convert units.
    output_schema:
      type: object
      properties:
        disbursed_ty_vnd: {type: number}
        pct_plan: {type: number}
        yoy_pct_point: {type: number}
        central_pct_plan: {type: number}
        local_pct_plan: {type: number}
        published_date: {type: string}
        provinces:
          type: array
          items:
            type: object
            properties:
              name: {type: string}
              amount_ty_vnd: {type: number}
            required: [name, amount_ty_vnd]
      required: [disbursed_ty_vnd, pct_plan, yoy_pct_point, central_pct_plan, local_pct_plan, published_date]
    fields:
      - {field: disbursed_ty_vnd, indicator_id: dtc_disbursed, measure_type: level, unit: ty_vnd, geo: VNM}
      - {field: pct_plan, indicator_id: dtc_disbursed, measure_type: pct_plan, unit: "%", geo: VNM}
      - {field: yoy_pct_point, indicator_id: dtc_disbursed, measure_type: yoy, unit: pct_point, geo: VNM}
      - {field: central_pct_plan, indicator_id: dtc_central, measure_type: pct_plan, unit: "%", geo: VNM}
      - {field: local_pct_plan, indicator_id: dtc_local, measure_type: pct_plan, unit: "%", geo: VNM}
    lists:
      - list_field: provinces
        geo_field: name
        fields:
          - {field: amount_ty_vnd, indicator_id: dtc_province_disbursed, measure_type: level, unit: ty_vnd}
    text_fields:
      - {pattern: 'vốn ngân sách trung ương đạt ([\d.,]+) tỷ đồng', indicator_id: dtc_central_disbursed, measure_type: level, unit: ty_vnd, geo: VNM}
      - {pattern: 'vốn ngân sách địa phương đạt ([\d.,]+) tỷ đồng', indicator_id: dtc_local_disbursed, measure_type: level, unit: ty_vnd, geo: VNM}
      - {pattern: 'tỷ lệ giải ngân đạt ([\d.,]+)% trên tổng kế hoạch điều chỉnh', indicator_id: dtc_disbursed_adjusted, measure_type: pct_plan, unit: "%", geo: VNM}
      - {pattern: 'Ngược lại, (\d+) bộ, cơ quan trung ương và (\d+) địa phương có tỷ lệ giải ngân thấp hơn', group: 1, indicator_id: dtc_central_below_average, measure_type: level, unit: units, geo: VNM}
      - {pattern: 'Ngược lại, (\d+) bộ, cơ quan trung ương và (\d+) địa phương có tỷ lệ giải ngân thấp hơn', group: 2, indicator_id: dtc_local_below_average, measure_type: level, unit: units, geo: VNM}
      - {pattern: 'Điện Biên đứng đầu với ([\d.,]+) điểm', indicator_id: dtc_province_score, measure_type: level, unit: points, geo: Điện Biên}
      - {pattern: 'Hải Phòng đạt ([\d.,]+) điểm', indicator_id: dtc_province_score, measure_type: level, unit: points, geo: Hải Phòng}
      - {pattern: 'Cà Mau đạt ([\d.,]+) điểm', indicator_id: dtc_province_score, measure_type: level, unit: points, geo: Cà Mau}
      - {pattern: 'Gia Lai đạt ([\d.,]+) điểm', indicator_id: dtc_province_score, measure_type: level, unit: points, geo: Gia Lai}
      - {pattern: 'Khánh Hòa đạt ([\d.,]+) điểm', indicator_id: dtc_province_score, measure_type: level, unit: points, geo: Khánh Hòa}
      - {pattern: 'Cao Bằng là địa phương duy nhất trong nhóm này, với ([\d.,]+) điểm', indicator_id: dtc_province_score, measure_type: level, unit: points, geo: Cao Bằng}

  - source_id: mof_dtc_by_province_2026
    publisher: Bộ Tài chính
    title_vi: "Giải ngân đầu tư công 2026 theo tỉnh/bộ (tìm trên cổng Bộ Tài chính)"
    url: https://www.mof.gov.vn/
    method: tinyfish
    period: "2026"
    decimal: vn
    max_usd: 0.7
    cache_ttl_h: 8760
    license_note: "Bộ Tài chính; trang JS, số liệu công khai, ghi nguồn"
    goal: |
      This is the Vietnamese Ministry of Finance portal (a JavaScript single-page app). Find an official 2026
      public-investment disbursement table by province (all 34 provinces) and/or by ministry. For each province return:
      province name, disbursed amount in billion VND (tỷ đồng) and percent of plan. Also return source_page_url = exact
      URL of the page showing the table. If no such table exists, return provinces = [] and source_page_url = "".
      Never invent numbers.
    output_schema:
      type: object
      properties:
        source_page_url: {type: string}
        provinces:
          type: array
          items:
            type: object
            properties:
              province: {type: string}
              amount_ty_vnd: {type: number}
              pct_plan: {type: number}
            required: [province, amount_ty_vnd, pct_plan]
      required: [provinces]
    record_list_field: provinces
    geo_field: province
    fields:
      - {field: amount_ty_vnd, indicator_id: dtc_province_disbursed, measure_type: level, unit: ty_vnd}
      - {field: pct_plan, indicator_id: dtc_province_disbursed, measure_type: pct_plan, unit: "%"}

