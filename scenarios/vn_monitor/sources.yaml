  conform:
    period: period
    indicator: indicator_id
    source: source_id
  grain_vi: Chỉ tiêu, kỳ, đơn vị quan sát và nguồn
  optional: true
- name: transfers
  source_id: transfers
  kind: file
  uri: data/snapshots/provincial_earmarked_transfers_2024_2025.csv
  license: Phụ lục số liệu của Nghị quyết 105/2023/QH15 và 160/2024/QH15.
  conform:
    province: province
    year: year
  grain_vi: Tỉnh theo địa giới trong phụ lục và năm
  optional: true
