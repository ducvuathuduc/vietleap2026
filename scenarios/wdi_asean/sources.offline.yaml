dataset: wdi_asean
primary: tax_revenue
analysis_table: gold.obt_integrated_wdi_asean
keys:
  country: [iso3]
  year: [year]
post_sql: [views.sql]
sources:
  - name: tax_revenue
    conform: &wide {prefix_columns: false}
    kind: file
    uri: &panel ../../data/practice/wdi_asia_fiscal_panel.csv
    license: &license World Bank, World Development Indicators practice snapshot (CC BY 4.0; indicator exceptions apply)
    options:
      filters: &asean {iso3: [VNM, BRN, KHM, IDN, LAO, MYS, MMR, PHL, SGP, THA]}
      columns: [iso3, year, tax_revenue_pct_gdp]
  - name: gdp_per_capita
    conform: *wide
    kind: file
    uri: *panel
    license: *license
    options:
      filters: *asean
      columns: [iso3, year, gdp_per_capita_usd]
  - name: gdp_growth
    conform: *wide
    kind: file
    uri: *panel
    license: *license
    options:
      filters: *asean
      columns: [iso3, year, gdp_growth_pct]
  - name: revenue
    conform: *wide
    kind: file
    uri: *panel
    license: *license
    options:
      filters: *asean
      columns: [iso3, year, revenue_pct_gdp]
  - name: expense
    conform: *wide
    kind: file
    uri: *panel
    license: *license
    options:
      filters: *asean
      columns: [iso3, year, expense_pct_gdp]
  - name: net_lending
    conform: *wide
    kind: file
    uri: *panel
    license: *license
    options:
      filters: *asean
      columns: [iso3, year, net_lending_pct_gdp]
  - name: central_gov_debt
    conform: *wide
    kind: file
    uri: *panel
    license: *license
    options:
      filters: *asean
      columns: [iso3, year, central_gov_debt_pct_gdp]
  - name: population
    conform: *wide
    kind: file
    uri: *panel
    license: *license
    options:
      filters: *asean
      columns: [iso3, year, population]
  - name: urban_pop
    conform: *wide
    kind: file
    uri: *panel
    license: *license
    options:
      filters: *asean
      columns: [iso3, year, urban_pop_pct]
  - name: inflation
    conform: *wide
    kind: file
    uri: *panel
    license: *license
    options:
      filters: *asean
      columns: [iso3, year, inflation_pct]
  - name: fdi_inflow
    conform: *wide
    kind: file
    uri: *panel
    license: *license
    options:
      filters: *asean
      columns: [iso3, year, fdi_inflow_pct_gdp]
  - name: education_spend
    conform: *wide
    kind: file
    uri: *panel
    license: *license
    options:
      filters: *asean
      columns: [iso3, year, education_spend_pct_gdp]
