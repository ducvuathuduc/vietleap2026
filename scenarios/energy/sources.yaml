dataset: energy_ev
primary: energy
analysis_table: gold.obt_integrated_energy_ev
keys:
  country: [iso3]
  year: [year]
sources:
  - name: energy
    kind: file
    uri: ../../data/cache/owid_energy.parquet
    license: Our World in Data (CC BY 4.0 for OWID work; upstream sources retain their terms)
    options:
      origin: https://catalog.ourworldindata.org/garden/energy/2026-09-10/owid_energy/owid_energy.parquet
      filters:
        iso_code: [VNM, BRN, KHM, IDN, LAO, MYS, MMR, PHL, SGP, THA, TLS]
        year: &years [2000, 2001, 2002, 2003, 2004, 2005, 2006, 2007, 2008, 2009, 2010, 2011, 2012, 2013, 2014, 2015, 2016, 2017, 2018, 2019, 2020, 2021, 2022, 2023, 2024, 2025]
      columns: [country, iso_code, year, renewables_electricity_share_pct, electricity_carbon_intensity_gco2eq_per_kwh, electricity_demand_per_capita_kwh, oil_energy_share_pct]
      rename: {iso_code: iso3}
  - name: ember
    kind: file
    uri: ../../data/cache/ember_yearly.csv
    license: Ember, Yearly Electricity Data (CC BY 4.0)
    options:
      origin: https://files.ember-energy.org/public-downloads/generation/outputs/release_generation_yearly_global.csv
      filters: {'ISO 3 code': [VNM, BRN, KHM, IDN, LAO, MYS, MMR, PHL, SGP, THA, TLS], 'Electricity source': [Renewables], Year: *years}
      columns: ['ISO 3 code', Year, 'Generation (TWh)', 'Share of generation (%)']
      rename: {'ISO 3 code': iso3, Year: year, 'Generation (TWh)': renewables_twh, 'Share of generation (%)': renewables_share_pct}
