# Conformed dimensions demo (offline): listings (tỉnh + ngày) ⨝ World Bank panel (năm, chỉ Việt Nam).
# Run: python de.py run scenarios/conformed/sources.yaml --primary vn_housing
#   → gold.conformed_vn__cdim_geo / cdim_date / cdim_year / cdim_country, cfact_* per source,
#     gold.obt_integrated_conformed_vn (mỗi tin BĐS + chỉ số vĩ mô VN cùng năm), join coverage in pipeline.json.
dataset: conformed_vn
sources:
  - name: vn_housing
    kind: file
    uri: ../../data/practice/synthetic_messy_bds.csv
    license: synthetic, generated by tools/make_synthetic.py
  - name: wdi_panel
    kind: file
    uri: ../../data/practice/wdi_asia_fiscal_panel.csv
    license: World Bank WDI, CC BY 4.0
    conform: {where: "iso3 = 'VNM'"}        # panel has 14 countries per year → keep Viet Nam so the join is 1 row/year
keys:
  province: [Tỉnh/TP, tinh, province]
  year: [year, nam]
  country: [iso3]
