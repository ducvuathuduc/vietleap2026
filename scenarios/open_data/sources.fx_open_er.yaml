dataset: fx_open_er
primary: usd_rates
sources:
  - name: usd_rates
    kind: api
    uri: https://open.er-api.com/v6/latest/USD
    license: ExchangeRate-API Open Access (Attribution required: https://www.exchangerate-api.com)
    options:
      paging: none
      rate_per_sec: 1
      watermark_col: time_last_update_unix
  - name: vnd_rates
    kind: api
    uri: https://open.er-api.com/v6/latest/VND
    license: ExchangeRate-API Open Access (Attribution required: https://www.exchangerate-api.com)
    options:
      paging: none
      rate_per_sec: 1
      watermark_col: time_last_update_unix
