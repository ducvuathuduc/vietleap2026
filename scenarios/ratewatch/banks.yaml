# RateWatch bank register — every Vietnamese commercial bank we could identify, 20/11/2026.
# code        : short code used in silver rows (CONTRACT A)
# status      : readable  = a free reader (aggregator / bank page / bank PDF) produces rows for it
#               unreadable = no free reader; reason says exactly what blocked us (evidence: X-TF §3, V-CURVE §1)
# methods     : readers expected to produce rows, cheapest first
# robots      : allow | blocked (robots.txt itself refuses) | unknown
# agg_names   : display names on laisuattietkiem.vn (the comparison table does not use our codes)
# html / pdf  : the column to read, pinned by hand — the reader never guesses which column is the household rate
# tinyfish    : banks to send a paid TinyFish agent run to (USD budget per run: RATEWATCH_TINYFISH_MAX_USD)
# pdf_urls    : the known-current sheet; date-stamped file names rotate, so the reader also discovers PDF links
#               on the rate page and scores them (lai-suat / tiet-kiem / khcn first).
