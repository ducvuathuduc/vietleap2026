# Demo: 5 source types → one warehouse; conformed dims (tỉnh, năm, quốc gia) join them into gold.obt_integrated_demo_multi. Run: python de.py run scenarios/demo/sources.yaml --primary vn_housing
dataset: demo_multi
sources:
  - name: vn_housing                       # file tải trực tiếp
    kind: file
    uri: ../../data/practice/synthetic_messy_bds.csv
    license: synthetic, generated by tools/make_synthetic.py
  - name: wdi_panel                        # Database / JDBC (SQLAlchemy)
    kind: sql
    uri: sqlite:///scenarios/demo/demo.sqlite
    options: {query: "SELECT * FROM wdi_panel WHERE year >= 2010"}
    conform: {where: "iso3 = 'VNM'"}       # 14 nước/năm → chỉ giữ Việt Nam khi ghép theo năm
  - name: vn_gdp_pc                        # Public API (World Bank, paging + retry + cache)
    kind: api
    uri: https://api.worldbank.org/v2/country/VN/indicator/NY.GDP.PCAP.CD
    options: {params: {format: json, per_page: 100, date: "2000:2025"}, records_path: "1", paging: worldbank}
    license: World Bank Open Data, CC BY 4.0
  - name: vn_provinces_wiki                # Web scraping (robots.txt respected)
    kind: scrape
    uri: https://vi.wikipedia.org/wiki/Tỉnh_thành_Việt_Nam
    options: {table_index: largest}
    license: Wikipedia, CC BY-SA 4.0
  - name: vnexpress_kinhdoanh              # Social listening / news (RSS)
    kind: social
    uri: https://vnexpress.net/rss/kinh-doanh.rss
keys:                                      # conformed keys (auto-detected too; listed here for clarity)
  province: [Tỉnh/TP, Tỉnh thành]
  year: [year, date]
  country: [iso3, countryiso3code]
