# docker compose up --build   →  dashboard http://localhost:3000, API docs http://localhost:8000/docs
# Ports are published on 127.0.0.1 only (local tool, no auth — see SECURITY.md).
services:
  api:
    build: {context: ., dockerfile: Dockerfile.api}
    environment:
      CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
      # KIT_ALLOW_PRIVATE_NET: "1"   # only for a trusted LAN demo
    volumes:
      - kit-data:/kit/data
      - kit-out:/kit/out
    ports: ["127.0.0.1:8000:8000"]
    restart: unless-stopped
  web:
    build:
      context: ./web
      args: {API_URL: "http://api:8000"}
    environment:
      API_URL: http://api:8000
      NEXT_PUBLIC_API_DOCS_URL: http://localhost:8000/docs
    env_file:
      - path: ./web/.env.local      # optional: GROQ_API_KEY / OPENAI_COMPATIBLE_* (git-ignored)
        required: false
    depends_on: [api]
    ports: ["127.0.0.1:3000:3000"]
    restart: unless-stopped
volumes:
  kit-data:
  kit-out:
